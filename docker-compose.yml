name: atrium

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bp_pass}
      POSTGRES_DB: ${POSTGRES_DB:-buildingpulse}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bp} -d ${POSTGRES_DB:-buildingpulse}"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://${POSTGRES_USER:-bp}:${POSTGRES_PASSWORD:-bp_pass}@postgres:5432/${POSTGRES_DB:-buildingpulse}?sslmode=disable",
        "up"
      ]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: .
      args:
        SERVICE: api
        GO_VERSION: ${GO_VERSION:-1.24}
    image: atrium-api:local
    restart: unless-stopped
    environment: &go-env
      DATABASE_URL: postgres://${POSTGRES_USER:-bp}:${POSTGRES_PASSWORD:-bp_pass}@postgres:5432/${POSTGRES_DB:-buildingpulse}?sslmode=disable
      AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  ingest:
    profiles: ["app"]
    build:
      context: .
      args:
        SERVICE: ingest
        GO_VERSION: ${GO_VERSION:-1.24}
    image: atrium-ingest:local
    restart: unless-stopped
    environment: *go-env
    ports:
      - "9090:9090"
    depends_on:
      rabbitmq:
        condition: service_healthy

  processor:
    profiles: ["app"]
    build:
      context: .
      args:
        SERVICE: processor
        GO_VERSION: ${GO_VERSION:-1.24}
    image: atrium-processor:local
    restart: unless-stopped
    environment: *go-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  simulator:
    profiles: ["app"]
    build:
      context: .
      args:
        SERVICE: simulator
        GO_VERSION: ${GO_VERSION:-1.24}
    image: atrium-simulator:local
    restart: unless-stopped
    command: ["-addr", "ingest:9090", "-devices", "100"]
    depends_on:
      ingest:
        condition: service_started

  grafana:
    profiles: ["dashboard"]
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # local demo only: anonymous visitors can view, only admin can edit
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/atrium.json
      POSTGRES_USER: ${POSTGRES_USER:-bp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bp_pass}
      POSTGRES_DB: ${POSTGRES_DB:-buildingpulse}
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
