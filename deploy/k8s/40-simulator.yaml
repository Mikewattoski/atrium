apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  namespace: atrium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulator
  template:
    metadata:
      labels:
        app: simulator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: simulator
          image: atrium-simulator:local
          imagePullPolicy: IfNotPresent
          args: ["-addr", "ingest:9090", "-devices", "100"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
