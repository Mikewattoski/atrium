apiVersion: v1
kind: ConfigMap
metadata:
  name: atrium-config
  namespace: atrium
data:
  HTTP_ADDR: ":8080"
  GRPC_ADDR: ":9090"
  REDIS_ADDR: "redis:6379"
  CACHE_TTL: "1m"
  RATE_LIMIT: "100"
  BATCH_SIZE: "500"
  FLUSH_INTERVAL: "1s"
  ALERT_TEMP_THRESHOLD: "30"
---
# Development values only. Secret data is base64-encoded, not encrypted:
# in a real cluster use Sealed Secrets, External Secrets or a cloud secret manager,
# and do not commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: atrium-secrets
  namespace: atrium
type: Opaque
stringData:
  POSTGRES_USER: bp
  POSTGRES_PASSWORD: bp_pass
  POSTGRES_DB: buildingpulse
  RABBITMQ_DEFAULT_USER: guest
  RABBITMQ_DEFAULT_PASS: guest
  DATABASE_URL: postgres://bp:bp_pass@postgres:5432/buildingpulse?sslmode=disable
  AMQP_URL: amqp://guest:guest@rabbitmq:5672/
