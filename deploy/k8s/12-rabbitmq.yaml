apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: atrium
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
# No persistent volume: queue contents are lost if the pod is recreated.
# Fine for a demo; production would use a StatefulSet (or the RabbitMQ operator).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: atrium
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: {name: atrium-secrets, key: RABBITMQ_DEFAULT_USER}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: atrium-secrets, key: RABBITMQ_DEFAULT_PASS}
          startupProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1Gi}
